name: Repository checks
on: [push, pull_request]
jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python scripts/reproduce.py verify
      - run: OPENBLAS_NUM_THREADS=1 python scripts/reproduce.py math
      - run: OPENBLAS_NUM_THREADS=1 python scripts/analyze_budget_benchmark.py
      - run: python scripts/cluster_sensitivity.py
